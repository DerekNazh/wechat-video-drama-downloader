[project]
name = "haoxia"
version = "1.0.0"
description = "号匣（haoxia）微信视频号下载器"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.44.0",
    "pywebview==6.2.1",
    "pythonnet==3.0.5",
    "httpx==0.28.1",
    "requests==2.33.1",
    "websocket-client==1.9.0",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "pydantic==2.13.1",
    "python-multipart==0.0.26",
    "openpyxl==3.1.5",
    "typer==0.25.1",
    "pyinstaller==6.19.0",
    "pydantic-settings==2.16.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
